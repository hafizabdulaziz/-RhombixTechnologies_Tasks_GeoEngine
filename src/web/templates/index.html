<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoTrace | IP & Network Intelligence</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: { 950: '#020617', 900: '#0f172a', 800: '#1e293b' },
                        rose: { 500: '#f43f5e' },
                        indigo: { 600: '#4f46e5' }
                    }
                }
            }
        }
    </script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0f172a; /* Slate 900 background */
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        .leaflet-container { background-color: #1e293b !important; }
    </style>
</head>
<body class="text-slate-100 h-screen flex flex-col overflow-hidden">

    <!-- Header Navigation -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-50 px-6 py-3 shrink-0">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-tr from-rose-500 to-indigo-600 p-2 rounded-lg shadow-lg shadow-rose-500/20">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg font-extrabold tracking-tight text-white">GeoTrace</h1>
                </div>
            </div>

            <div id="health-widget" class="flex items-center bg-slate-950/60 border border-slate-800 px-3 py-1.5 rounded-lg">
                <span class="relative flex h-2 w-2 mr-2">
                    <span id="health-ping" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span id="health-dot" class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                </span>
                <span id="health-status-text" class="text-[10px] font-semibold text-slate-400">Systems Operational</span>
            </div>
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="flex-grow max-w-7xl w-full mx-auto p-4 flex flex-col min-h-0 overflow-hidden">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 flex-grow overflow-hidden">

        <!-- Left Column: Search & Metrics (4/12) -->
        <section class="lg:col-span-4 flex flex-col gap-4 overflow-hidden">
            <!-- Search Panel -->
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-xl shrink-0">
                <h2 class="text-sm font-bold text-white mb-2 flex items-center gap-1.5">
                    <svg class="w-4 h-4 text-rose-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    Lookup Target
                </h2>
                <form id="lookup-form" class="space-y-2" onsubmit="handleLookup(event)">
                    <input type="text" id="ip-input" placeholder="e.g., 8.8.8.8" required class="w-full bg-slate-950 border border-slate-800 focus:border-rose-500 text-white rounded-lg py-2 px-3 text-xs outline-none">
                    <button type="submit" id="search-btn" class="w-full bg-gradient-to-r from-rose-500 to-indigo-600 text-white font-bold py-2 rounded-lg text-xs transition-all hover:opacity-90">Analyze</button>
                </form>
                <div id="error-banner" class="hidden mt-2 bg-rose-950/40 border border-rose-900/60 rounded-lg p-2 text-[10px] text-rose-300"></div>
            </div>

            <!-- Metrics Grid -->
            <div class="grid grid-cols-2 gap-2 shrink-0">
                <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl"><div class="text-[9px] text-slate-500 font-bold uppercase">IP</div><div id="metric-ip" class="text-xs font-bold text-white truncate">-</div></div>
                <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl"><div class="text-[9px] text-slate-500 font-bold uppercase">Location</div><div id="metric-country-name" class="text-xs font-bold text-white truncate">-</div></div>
                <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl"><div class="text-[9px] text-slate-500 font-bold uppercase">City</div><div id="metric-city" class="text-xs font-bold text-white truncate">-</div></div>
                <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl"><div class="text-[9px] text-slate-500 font-bold uppercase">Provider</div><div id="metric-provider" class="text-xs font-bold text-white truncate">-</div></div>
            </div>

            <!-- History Table -->
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 shadow-xl flex-grow overflow-hidden flex flex-col min-h-0">
                <h2 class="text-xs font-bold text-white mb-2">History</h2>
                <div class="overflow-y-auto flex-grow rounded-lg border border-slate-800 bg-slate-950/40">
                    <table class="w-full text-left text-[10px]">
                        <tbody id="history-tbody"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- Right Column: Interactive Live Map (8/12) -->
        <section class="lg:col-span-8 flex flex-col overflow-hidden">
            <div class="bg-slate-900 border border-slate-800 rounded-xl shadow-xl flex-grow overflow-hidden flex flex-col min-h-0">
                <div class="bg-slate-950 px-4 py-2 flex items-center justify-between border-b border-slate-800 shrink-0">
                    <h2 class="text-xs font-bold text-white">Live Map</h2>
                    <button onclick="resetMap()" class="text-[9px] bg-slate-800 text-slate-300 px-2 py-1 rounded">Recenter</button>
                </div>
                <div id="map" class="flex-grow w-full z-10"></div>
            </div>
        </section>
    </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 bg-slate-900/40 py-2 px-6 text-center text-[10px] text-slate-600 shrink-0">
        GeoTrace • IP & Network Intelligence
    </footer>

    <!-- Frontend logic scripts -->
    <script>
        let map;
        let currentMarker = null;
        let currentPulse = null;

        // On DOM Load
        document.addEventListener('DOMContentLoaded', () => {
            initializeMap();
            loadHistory();
            checkAPIHealth();
        });

        // Initialize Map
        function initializeMap() {
            // Instantiate the map pointing to a default global view (lat=20, lon=0, zoom=2)
            map = L.map('map', {
                zoomControl: true,
                attributionControl: true
            }).setView([20, 0], 2);

            // Add the classic custom dark-style OpenStreetMap tiles (or default street map)
            // Leaflet allows changing tiles easily. OpenStreetMap is robust.
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" class="hover:underline">OpenStreetMap</a> contributors'
            }).addTo(map);
        }

        // Reset map to initial global view
        function resetMap() {
            map.flyTo([20, 0], 2, {
                animate: true,
                duration: 1.2
            });
        }

        // Check Health Endpoint
        async function checkAPIHealth() {
            try {
                const res = await fetch('/api/v1/health');
                const data = await res.json();
                
                const ping = document.getElementById('health-ping');
                const dot = document.getElementById('health-dot');
                const text = document.getElementById('health-status-text');

                if (res.ok && data.status === 'healthy') {
                    ping.className = "animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75";
                    dot.className = "relative inline-flex rounded-full h-3 w-3 bg-emerald-500";
                    text.textContent = "Systems Operational";
                    text.className = "text-xs font-semibold text-emerald-400";
                } else {
                    ping.className = "animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75";
                    dot.className = "relative inline-flex rounded-full h-3 w-3 bg-amber-500";
                    text.textContent = "Degraded Failover";
                    text.className = "text-xs font-semibold text-amber-400";
                }
            } catch (err) {
                console.error("Health Check failed: ", err);
                const ping = document.getElementById('health-ping');
                const dot = document.getElementById('health-dot');
                const text = document.getElementById('health-status-text');

                ping.className = "animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-75";
                dot.className = "relative inline-flex rounded-full h-3 w-3 bg-rose-500";
                text.textContent = "API Offline";
                text.className = "text-xs font-semibold text-rose-400";
            }
        }

        // Fetch & Populate History
        async function loadHistory() {
            try {
                const response = await fetch('/api/v1/history');
                if (!response.ok) throw new Error("Could not retrieve history");
                
                const result = await response.json();
                const history = result.history;
                // Optional: Use result.analytics for summary metrics if needed
                const tbody = document.getElementById('history-tbody');
                tbody.innerHTML = ''; // Clear previous

                if (history.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="3" class="p-8 text-center text-slate-600 font-medium">No lookups recorded yet.</td>
                        </tr>
                    `;
                    return;
                }

                history.forEach(item => {
                    const row = document.createElement('tr');
                    row.className = "border-b border-slate-800/50 hover:bg-slate-900/40 transition-colors";
                    
                    const ipSpan = `<span class="font-bold text-slate-200">${item.ip}</span>`;
                    const locationSpan = `<span class="text-slate-400 font-medium">${item.city}, ${item.country}</span>`;
                    
                    row.innerHTML = `
                        <td class="p-3 font-semibold text-slate-300 truncate max-w-[140px]" title="${item.ip}">
                            ${item.ip}
                        </td>
                        <td class="p-3 text-slate-400 truncate max-w-[180px]" title="${item.city}, ${item.country}">
                            ${item.city}, ${item.country}
                        </td>
                        <td class="p-3 text-center">
                            <button 
                                onclick="plotHistoricalNode(${item.latitude}, ${item.longitude}, '${item.city}', '${item.country}', '${item.ip}', '${item.provider}')"
                                class="text-xs bg-indigo-500/10 hover:bg-indigo-500/20 active:scale-95 text-indigo-400 font-bold px-2.5 py-1.5 rounded-lg border border-indigo-500/20 transition-all duration-100"
                            >
                                Plot
                            </button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (err) {
                console.error("Error loading history: ", err);
                document.getElementById('history-tbody').innerHTML = `
                    <tr>
                        <td colspan="3" class="p-8 text-center text-rose-500 font-bold">Failed to load history list.</td>
                    </tr>
                `;
            }
        }

        // Helper: Clear UI state
        function resetMetricsUI() {
            document.getElementById('metric-ip').textContent = '-';
            document.getElementById('metric-country-name').textContent = 'Country Name';
            document.getElementById('metric-country-flag').textContent = '🌍';
            document.getElementById('metric-city').textContent = '-';
            document.getElementById('metric-region').textContent = 'State/Region';
            document.getElementById('metric-coords').textContent = '-';
            document.getElementById('metric-latency').textContent = '-';
            document.getElementById('metric-provider').textContent = 'Provider: -';
            
            // Remove previous active marker/pulses if they exist
            if (currentMarker) map.removeLayer(currentMarker);
            if (currentPulse) map.removeLayer(currentPulse);
            currentMarker = null;
            currentPulse = null;
        }

        // Form Submit Handler
        async function handleLookup(e) {
            e.preventDefault();

            const input = document.getElementById('ip-input');
            const target = input.value.trim();
            if (!target) return;

            const searchBtn = document.getElementById('search-btn');
            const spinner = document.getElementById('spinner');
            const errorBanner = document.getElementById('error-banner');
            const errorMessage = document.getElementById('error-message');

            // Reset UI and Set loading state
            resetMetricsUI();
            searchBtn.disabled = true;
            spinner.classList.remove('hidden');
            errorBanner.classList.add('hidden');

            try {
                const response = await fetch('/api/v1/lookup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ip_or_domain: target })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.detail || "Lookup request failed.");
                }

                // Populate metric cards
                const geo = result.data;
                document.getElementById('metric-ip').textContent = geo.ip;
                document.getElementById('metric-ip').title = geo.ip;
                
                document.getElementById('metric-country-name').textContent = geo.country || 'Unknown';
                document.getElementById('metric-country-flag').textContent = getFlagEmoji(geo.country);
                
                document.getElementById('metric-city').textContent = geo.city || 'Unknown';
                document.getElementById('metric-region').textContent = geo.region || 'Unknown';
                
                document.getElementById('metric-coords').textContent = `${geo.latitude?.toFixed(4) || '-'}, ${geo.longitude?.toFixed(4) || '-'}`;
                
                document.getElementById('metric-latency').textContent = `${geo.latency_ms} ms`;
                document.getElementById('metric-provider').textContent = `Provider: ${(geo.provider || 'Unknown').toUpperCase()}`;

                // Plot on interactive map
                if (geo.latitude !== null && geo.longitude !== null) {
                    plotOnMap(geo.latitude, geo.longitude, geo.city, geo.country, geo.ip, geo.provider);
                }

                // Clear input and reload the history list
                input.value = '';
                await loadHistory();
                await checkAPIHealth();

            } catch (err) {
                console.error("Lookup error:", err);
                resetMetricsUI(); // Ensure UI is cleared on error
                errorMessage.textContent = err.message || "Could not resolve or lookup target geolocation details.";
                errorBanner.classList.remove('hidden');
            } finally {
                // Clear loading state
                searchBtn.disabled = false;
                spinner.classList.add('hidden');
            }
        }

        // Plot node on Leaflet Map
        function plotOnMap(lat, lon, city, country, ip, provider) {
            // Remove previous active marker/pulses if they exist
            if (currentMarker) map.removeLayer(currentMarker);
            if (currentPulse) map.removeLayer(currentPulse);

            // Add translucent pulsing ring indicating accuracy range
            currentPulse = L.circle([lat, lon], {
                color: '#4f46e5', // Indigo
                fillColor: '#6366f1',
                fillOpacity: 0.1,
                weight: 1,
                radius: 20000 
            }).addTo(map);

            // Create professional custom marker
            currentMarker = L.circleMarker([lat, lon], {
                color: '#ffffff',
                fillColor: '#f43f5e', // Rose-500
                fillOpacity: 1,
                weight: 2,
                radius: 6
            }).addTo(map);

            // Bind elegant modern popup
            const popupContent = `
                <div class="p-2 min-w-[160px] text-slate-800">
                    <h3 class="font-bold text-xs text-slate-900 border-b pb-1 mb-1">${city}, ${country}</h3>
                    <div class="text-[10px] space-y-0.5">
                        <p><span class="font-semibold text-slate-500">IP:</span> ${ip}</p>
                        <p><span class="font-semibold text-slate-500">Provider:</span> ${provider.toUpperCase()}</p>
                    </div>
                </div>
            `;
            
            currentMarker.bindPopup(popupContent, {
                closeButton: true,
                className: 'custom-popup'
            }).openPopup();

            // Fit map to marker view
            map.flyTo([lat, lon], 6, {
                animate: true,
                duration: 0.8
            });
        }

        // Plot historical record from action click
        function plotHistoricalNode(lat, lon, city, country, ip, provider) {
            if (lat === null || lon === null || isNaN(lat) || isNaN(lon)) {
                alert("Cannot plot node: Missing or invalid geographical coordinates.");
                return;
            }

            // Update metrics display to show historical item
            document.getElementById('metric-ip').textContent = ip;
            document.getElementById('metric-ip').title = ip;
            document.getElementById('metric-country-name').textContent = country;
            document.getElementById('metric-country-flag').textContent = getFlagEmoji(country);
            document.getElementById('metric-city').textContent = city;
            document.getElementById('metric-region').textContent = "Stored Node";
            document.getElementById('metric-coords').textContent = `${lat.toFixed(4)}, ${lon.toFixed(4)}`;
            document.getElementById('metric-latency').textContent = "Historical";
            document.getElementById('metric-provider').textContent = `Provider: ${provider.toUpperCase()}`;

            // Plot it on the map
            plotOnMap(lat, lon, city, country, ip, provider);
        }

        // Helper: Country to Emoji Flag
        function getFlagEmoji(countryName) {
            if (!countryName || countryName === 'Unknown') return '🌍';
            
            // Map common countries to emojis for added polish
            const countryFlags = {
                "United States": "🇺🇸", "US": "🇺🇸", "United Kingdom": "🇬🇧", "UK": "🇬🇧",
                "Germany": "🇩🇪", "France": "🇫🇷", "Canada": "🇨🇦", "Pakistan": "🇵🇰",
                "India": "🇮🇳", "China": "🇨🇳", "Japan": "🇯🇵", "Australia": "🇦🇺",
                "Netherlands": "🇳🇱", "Singapore": "🇸🇬", "Ireland": "🇮🇪", "Brazil": "🇧🇷"
            };
            return countryFlags[countryName] || "📍";
        }
    </script>
</body>
</html>
